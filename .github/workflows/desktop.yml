name: Build NebulaDrive desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'index.html', '.github/workflows/desktop.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: desktop/dist/*.exe
          - platform: macOS
            os: macos-latest
            artifact: desktop/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check the app starts from source
        shell: bash
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-source.json
        run: npm run prepare-app && npx electron . --smoke
      - name: Build Windows installers
        if: matrix.platform == 'Windows'
        run: npm run dist:win
      - name: Build macOS app
        if: matrix.platform == 'macOS'
        run: npm run dist:mac
      - name: Check the built Windows app
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-packaged.json
        run: |
          $p = Start-Process -FilePath "dist/win-unpacked/NebulaDrive.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Check the built macOS app
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke-packaged.json
        run: |
          APP=$(ls -d dist/mac*/NebulaDrive.app | head -1)
          "$APP/Contents/MacOS/NebulaDrive" --smoke
      - name: Report check results
        if: always()
        shell: bash
        run: |
          for f in "$RUNNER_TEMP"/smoke-*.json; do
            if [ -f "$f" ]; then echo "::notice title=$(basename "$f")::$(tr -d '\n' < "$f")"; fi
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: nebuladrive-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: NebulaDrive Desktop ${{ github.ref_name }}
          make_latest: true
          body: |
            NebulaDrive for Windows and macOS. The same app as the website, in its own window.

            Windows: NebulaDrive-Setup (installer) or the portable .exe. macOS: the .dmg.
            Windows may warn that the app is unsigned: choose More info, then Run anyway.
            On macOS, right-click the app and choose Open the first time.
          files: release-assets/*

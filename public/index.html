<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaDrive - Personal Cloud Storage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">☁️</div>
                <h2>NebulaDrive</h2>
                <small>Your Personal Cloud</small>
            </div>
            
            <div class="stats-card">
                <div class="stat">
                    <span class="stat-label">Total Files</span>
                    <span class="stat-value" id="totalFiles">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Storage Used</span>
                    <span class="stat-value" id="totalSize">0</span>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search files...">
            </div>
            
            <button class="clear-btn" id="clearAllBtn">🗑️ Clear All Files</button>
        </aside>
        
        <main class="main-content">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" multiple style="display: none">
                <div class="upload-content">
                    <div class="upload-icon">📤</div>
                    <h3>Drag & Drop Files Here</h3>
                    <p>or click to browse</p>
                    <small>Unlimited storage • Any file type • No size limits</small>
                </div>
            </div>
            
            <div class="upload-progress" id="uploadProgress" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text">Uploading...</div>
            </div>
            
            <div class="files-header">
                <h3>Your Files</h3>
                <div class="view-options">
                    <button class="view-btn active" data-view="grid">📱 Grid</button>
                    <button class="view-btn" data-view="list">📋 List</button>
                </div>
            </div>
            
            <div class="files-container" id="filesContainer">
                <div class="loading">Loading your files...</div>
            </div>
        </main>
    </div>
    
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
